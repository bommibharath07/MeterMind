name: Build immutable images
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    runs-on: [self-hosted, linux, metermind-private]
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, project: API, context: ., file: Dockerfile}
          - {name: worker, project: Worker, context: ., file: Dockerfile}
          - {name: simulator, project: Simulator, context: ., file: Dockerfile}
          - {name: migration, project: MigrationJob, context: ., file: Dockerfile}
          - {name: mcp, project: McpServer, context: ., file: Dockerfile}
          - {name: frontend, project: frontend, context: frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$ACR_NAME"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: PROJECT=${{ matrix.project }}
          tags: ${{ vars.ACR_SERVER }}/metermind/${{ matrix.name }}:${{ github.sha }}
          push: true
          provenance: true
          sbom: true
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ vars.ACR_SERVER }}/metermind/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - name: Record exact image digest
        env:
          IMAGE: ${{ vars.ACR_SERVER }}/metermind/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: jq -n --arg key "$NAME" --arg image "$IMAGE" --arg sha "$SOURCE_SHA" '{($key):$image,sourceSha:$sha}' > "$NAME.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ matrix.name }}.json
  manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: images
      - run: jq -s 'add' images/*.json > release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release.json
