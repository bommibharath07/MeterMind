name: Deploy tested release
on:
  workflow_call:
    inputs:
      environment: {required: true, type: string}
      manifest_run_id: {required: true, type: string}
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    runs-on: [self-hosted, linux, metermind-private]
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency: metermind-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify trusted image build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.manifest_run_id }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$EXPECTED_SHA" '.conclusion=="success" and .head_sha==$sha and .path==".github/workflows/build-images.yml" and (.event=="push" or .event=="workflow_dispatch")' run.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ github.token }}
      - name: Require staging evidence before production
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/actions/workflows/deploy-staging.yml/runs?head_sha=$SOURCE_SHA&status=success" --jq '.workflow_runs[0].id' > staging-run
          test -s staging-run && test "$(cat staging-run)" != null
          gh run download "$(cat staging-run)" --repo "$REPO" --name staging-tested --dir /tmp/staging-tested
          cmp release.json /tmp/staging-tested/release.json
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy jobs, migrate, then deploy services
        env:
          MM_ENVIRONMENT: ${{ inputs.environment }}
          MM_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          MM_AUTH_AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          MM_AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          MM_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MM_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          MM_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MM_SMOKE_TOKEN: ${{ secrets.SMOKE_ACCESS_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          MM_SOURCE_ACR_ID: ${{ vars.SOURCE_ACR_RESOURCE_ID }}
        run: bash scripts/cloud-deploy.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.environment == 'staging'
        with:
          name: staging-tested
          path: |
            release.json
            artifacts/smoke.json
