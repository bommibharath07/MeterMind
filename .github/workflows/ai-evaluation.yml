name: Trusted live AI evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: ai-evaluation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: dotnet test tests/MeterMind.AI.Tests --logger 'trx;LogFileName=ai.trx'
      - name: Bounded Responses API tool capability probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/live-ai-evaluation.py
