name: Infrastructure
on:
  pull_request:
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: az bicep build --file infra/main.bicep
  provision:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, linux, metermind-private]
    environment: ${{ inputs.environment }}
    concurrency: metermind-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reviewed bootstrap infrastructure
        env:
          MM_ENVIRONMENT: ${{ inputs.environment }}
          MM_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          MM_AUTH_AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          MM_AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          MM_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bash scripts/cloud-deploy.sh bootstrap
