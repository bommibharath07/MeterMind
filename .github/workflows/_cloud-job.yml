name: Cloud network job
on:
  workflow_call:
    inputs:
      environment: {required: true, type: string}
      job: {required: true, type: string}
permissions:
  contents: read
  id-token: write
jobs:
  execute:
    runs-on: [self-hosted, linux, metermind-private]
    environment: ${{ inputs.environment }}
    concurrency: metermind-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Execute and wait for cloud job
        env:
          MM_ENVIRONMENT: ${{ inputs.environment }}
          MM_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          MM_JOB: ${{ inputs.job }}
        run: bash scripts/cloud-job.sh "$MM_JOB"
